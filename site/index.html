/* an opened window gets its own address (#id), so it can be shared, and Back closes it */
let curHash=location.hash.slice(1);
function pushWin(id){if(id==='hello'||location.hash==='#'+id)return;try{history.pushState({win:id},'','#'+id);curHash=id}catch(_){}}
function closeByUser(id){if(location.hash==='#'+id){if(history.state&&history.state.win===id){history.back();return}try{history.replaceState(null,'',location.pathname+location.search)}catch(_){}curHash=''}closeWin(id)}
function syncHash(){const id=location.hash.slice(1);if(id===curHash)return;const prev=curHash;curHash=id;
  if(!document.body.classList.contains('docmode')&&prev&&prev!=='hello'&&open[prev])closeWin(prev);
  if(WINS[id])openWin(id)}
function renderTabs(active){tabs.innerHTML=Object.keys(open).map(id=>`<button class="tab${open[id].min?' min':''}${id===active?' on':''}" data-tab="${id}">${esc(WINS[id].title)}</button>`).join('')}
function wire(el,id){
  el.addEventListener('pointerdown',()=>focusWin(id));
  el.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();const a=b.dataset.act;
    if(a==='close')closeByUser(id);if(a==='min'){open[id].min=true;el.hidden=true;renderTabs()}if(a==='max')el.classList.toggle('max')}));
  const bar=el.querySelector('.bar');let sx,sy,ox,oy,drag=false;
  bar.addEventListener('pointerdown',e=>{if(e.target.closest('[data-act]')||el.classList.contains('max'))return;drag=true;sx=e.clientX;sy=e.clientY;ox=el.offsetLeft;oy=el.offsetTop;bar.setPointerCapture(e.pointerId)});
  bar.addEventListener('pointermove',e=>{if(!drag)return;const{W,H}=deskSize();
    el.style.left=Math.max(-el.offsetWidth+120,Math.min(W-80,ox+e.clientX-sx))+'px';el.style.top=Math.max(0,Math.min(H-40,oy+e.clientY-sy))+'px'});
  bar.addEventListener('pointerup',()=>{drag=false});
  bar.addEventListener('dblclick',e=>{if(!e.target.closest('[data-act]'))el.classList.toggle('max')});
  /* resize from any edge or corner, like a desktop window */
  let rs=null;
  el.querySelectorAll('[data-rz]').forEach(hd=>{
    hd.addEventListener('pointerdown',e=>{if(el.classList.contains('max')||e.button!==0)return;e.preventDefault();e.stopPropagation();focusWin(id);
      rs={d:hd.dataset.rz,x:e.clientX,y:e.clientY,l:el.offsetLeft,t:el.offsetTop,w:el.offsetWidth,h:el.offsetHeight};el.classList.add('resizing');hd.setPointerCapture(e.pointerId)});
    hd.addEventListener('pointermove',e=>{if(!rs)return;const{W,H}=deskSize();const dx=e.clientX-rs.x,dy=e.clientY-rs.y,MW=320,MH=180;
      let l=rs.l,t=rs.t,w=rs.w,h=rs.h;
      if(rs.d.includes('e'))w=Math.max(MW,Math.min(W-l-8,rs.w+dx));
      if(rs.d.includes('s'))h=Math.max(MH,Math.min(H-t-8,rs.h+dy));
      if(rs.d.includes('w')){l=Math.max(0,Math.min(rs.l+rs.w-MW,rs.l+dx));w=rs.w+rs.l-l}
      if(rs.d.includes('n')){t=Math.max(0,Math.min(rs.t+rs.h-MH,rs.t+dy));h=rs.h+rs.t-t}
      el.style.left=l+'px';el.style.top=t+'px';el.style.width=w+'px';el.style.height=h+'px';el.style.maxHeight='none'});
    const end=()=>{rs=null;el.classList.remove('resizing')};hd.addEventListener('pointerup',end);hd.addEventListener('pointercancel',end);
    hd.addEventListener('dblclick',()=>el.classList.toggle('max'));
  });
}

function iconSvg(kind,c,sfx=''){
  if(kind==='MSN')return `<svg width="52" height="50" viewBox="0 0 52 50" aria-hidden="true"><defs><radialGradient id="buddyB${sfx}" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#A8DBFF"/><stop offset=".5" stop-color="#2E8BE6"/><stop offset="1" stop-color="#15529E"/></radialGradient><radialGradient id="buddyG${sfx}" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#C6F58E"/><stop offset=".5" stop-color="#4DB52A"/><stop offset="1" stop-color="#22731A"/></radialGradient></defs><g stroke="#0C0F15" stroke-width="2" stroke-linejoin="round"><path d="M22 40c0-11 5-17 12-17s12 6 12 17z" fill="url(#buddyB${sfx})"/><circle cx="34" cy="13" r="8" fill="url(#buddyB${sfx})"/><path d="M5 48c0-12 6-18 14-18s14 6 14 18z" fill="url(#buddyG${sfx})"/><circle cx="19" cy="19" r="9" fill="url(#buddyG${sfx})"/></g><ellipse cx="16" cy="15" rx="3.6" ry="2.2" fill="#fff" opacity=".55" transform="rotate(-25 16 15)"/><ellipse cx="31.5" cy="9.5" rx="3" ry="1.8" fill="#fff" opacity=".55" transform="rotate(-25 31.5 9.5)"/></svg>`;
  if(kind==='APP')return `<svg width="50" height="50" viewBox="0 0 32 32" aria-hidden="true"><rect x="1" y="1" width="30" height="30" rx="8" fill="${c}" stroke="#0C0F15" stroke-width="2"/><path d="M8 15 Q16 9 24 15" stroke="#1A1405" stroke-width="2.2" fill="none" stroke-linecap="round"/><path d="M9.5 20 Q16 25 22.5 20" stroke="#1A1405" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg>`;
  if(kind==='DIR')return `<svg width="54" height="46" viewBox="0 0 54 46" aria-hidden="true"><path d="M3 9 h17 l5 6 h26 v28 H3 Z" fill="${c}" stroke="#0C0F15" stroke-width="2.5" stroke-linejoin="round"/><path d="M3 19 H51" stroke="#0C0F15" stroke-width="2.5"/></svg>`;
  return `<svg width="46" height="56" viewBox="0 0 46 56" aria-hidden="true"><path d="M3 3 H31 L43 15 V53 H3 Z" fill="#F4F1EA" stroke="#0C0F15" stroke-width="2.5" stroke-linejoin="round"/><path d="M31 3 V15 H43" fill="none" stroke="#0C0F15" stroke-width="2.5" stroke-linejoin="round"/><rect x="3" y="32" width="40" height="14" fill="${c}" stroke="#0C0F15" stroke-width="2.5"/><text x="23" y="43" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10" font-weight="600" fill="#0C0F15">${kind}</text></svg>`;
}
$('#icons').innerHTML=DESKTOP.map(id=>`<button class="icon" data-icon="${id}" aria-label="Open ${LABEL[id]}">${iconSvg(...ICON_SYM[id])}<span>${LABEL[id]}</span>${id==='moonmates'||id==='careloop'?'<i class="badge">winner</i>':''}${id==='bagcheck'?'<i class="badge" style="background:#F5B544">try me</i>':''}</button>`).join('');
let iconClickBlock=0;
$('#icons').addEventListener('click',e=>{const b=e.target.closest('.icon');if(!b||Date.now()<iconClickBlock)return;document.querySelectorAll('.icon').forEach(i=>i.classList.toggle('sel',i===b));openWin(b.dataset.icon)});
$('#icons').addEventListener('dblclick',e=>{const b=e.target.closest('.icon');if(b&&Date.now()>=iconClickBlock)openWin(b.dataset.icon)});
/* draggable icons: positions are a per-viewer convenience */
(function(){
  const box=$('#icons');let freed=false,drag=null;
  const key='alex-icons';
  function free(){if(freed)return;freed=true;const base=box.getBoundingClientRect();
    const pos=[...box.children].map(b=>{const r=b.getBoundingClientRect();return[b,r.left-base.left,r.top-base.top]});
    box.classList.add('free');pos.forEach(([b,x,y])=>{b.style.left=x+'px';b.style.top=y+'px'})}
  function clamp(b,x,y){const{W,H}=deskSize();const ox=box.offsetLeft,oy=box.offsetTop;
    return[Math.max(-ox,Math.min(W-ox-b.offsetWidth,x)),Math.max(-oy,Math.min(H-oy-b.offsetHeight,y))]}
  function save(){const o={};[...box.children].forEach(b=>{o[b.dataset.icon]=[b.offsetLeft,b.offsetTop]});try{localStorage.setItem(key,JSON.stringify(o))}catch(e){}}
  let saved=null;try{saved=JSON.parse(localStorage.getItem(key)||'null')}catch(e){}
  if(saved&&typeof saved==='object'&&box.offsetWidth>0){free();[...box.children].forEach(b=>{const p=saved[b.dataset.icon];if(Array.isArray(p)){const[x,y]=clamp(b,+p[0]||0,+p[1]||0);b.style.left=x+'px';b.style.top=y+'px'}})}
  box.addEventListener('pointerdown',e=>{const b=e.target.closest('.icon');if(!b||e.button!==0)return;drag={b,sx:e.clientX,sy:e.clientY,moved:false,pid:e.pointerId}});
  addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;
    if(!drag.moved){if(Math.hypot(dx,dy)<6)return;free();drag.moved=true;drag.ox=drag.b.offsetLeft;drag.oy=drag.b.offsetTop;drag.b.classList.add('dragging');try{drag.b.setPointerCapture(drag.pid)}catch(_){}}
    const[x,y]=clamp(drag.b,drag.ox+dx,drag.oy+dy);drag.b.style.left=x+'px';drag.b.style.top=y+'px'});
  function end(){if(!drag)return;if(drag.moved){drag.b.classList.remove('dragging');iconClickBlock=Date.now()+350;save()}drag=null}
  addEventListener('pointerup',end);addEventListener('pointercancel',end);
  function arrange(){const icons=[...box.children];const before=icons.map(b=>b.getBoundingClientRect());
    box.classList.remove('free');icons.forEach(b=>{b.style.left='';b.style.top=''});freed=false;try{localStorage.removeItem(key)}catch(e){}
    if(reduce)return;icons.forEach((b,i)=>{const a=b.getBoundingClientRect(),dx=before[i].left-a.left,dy=before[i].top-a.top;if(!dx&&!dy)return;
      b.animate([{transform:`translate(${dx}px,${dy}px)`},{transform:'none'}],{duration:450,easing:'cubic-bezier(.2,.8,.2,1)',delay:i*25})})}
  const menu=document.createElement('div');menu.className='ctx';menu.hidden=true;menu.setAttribute('role','menu');menu.setAttribute('aria-label','Desktop');
  menu.innerHTML='<button role="menuitem" data-ctx="arrange">Arrange icons</button>';document.body.appendChild(menu);
  desk.addEventListener('contextmenu',e=>{if(e.target.closest('.win'))return;e.preventDefault();menu.hidden=false;
    menu.style.left=Math.min(e.clientX,innerWidth-menu.offsetWidth-6)+'px';menu.style.top=Math.min(e.clientY,innerHeight-menu.offsetHeight-6)+'px';menu.querySelector('button').focus()});
  addEventListener('pointerdown',e=>{if(!menu.hidden&&!e.target.closest('.ctx'))menu.hidden=true},true);
  addEventListener('keydown',e=>{if(e.key==='Escape'&&!menu.hidden){menu.hidden=true;e.stopPropagation()}},true);
  addEventListener('blur',()=>{menu.hidden=true});
  menu.addEventListener('click',e=>{const b=e.target.closest('[data-ctx]');if(!b)return;menu.hidden=true;if(b.dataset.ctx==='arrange')arrange()});
  addEventListener('resize',()=>{if(!freed)return;[...box.children].forEach(b=>{const[x,y]=clamp(b,b.offsetLeft,b.offsetTop);b.style.left=x+'px';b.style.top=y+'px'})});
})();


/* ---------- document mode ---------- */
let docBuilt=false;
function buildDoc(){if(docBuilt)return;docBuilt=true;const doc=$('#doc');DOC_ORDER.forEach(id=>doc.appendChild(makeWin(id,true)))}
function setMode(m){
  const docm=m==='doc'||innerWidth<=760;document.body.classList.toggle('docmode',docm);
  $('#modeBtn').textContent=docm?'Open the desktop':'Read as a document';
  if(docm)buildDoc();
  try{localStorage.setItem('alex-mode',m)}catch(e){}
}
$('#modeBtn').addEventListener('click',()=>setMode(document.body.classList.contains('docmode')?'desk':'doc'));

/* ---------- phone menu ---------- */
const mnav=$('#mnav'),mbtn=$('#menuBtn'),mscrim=$('#mnavScrim'),curTab=$('#curTab');
$('#mnavList').innerHTML='<li class="mlab">Projects</li>'+DATA.projects.filter(p=>p.status==='case').map(p=>
  `<li><a href="#${p.id}" data-go="${p.id}">${esc(p.title)}${p.badge?`<span class="tag ${p.badge}">${p.badge}</span>`:''}</a></li>`).join('')+
  '<li class="sep" role="presentation"></li><li><a href="#about" data-go="about">About</a></li><li><a href="#contact" data-go="contact">Contact</a></li>'+
  `<li><a href="${CV_URL}" data-cv-quick>Download CV</a></li>`;
function setMenu(on){mnav.hidden=!on;mscrim.hidden=!on;mbtn.setAttribute('aria-expanded',String(on));
  if(on){const a=mnav.querySelector('[aria-current="true"]')||mnav.querySelector('a');a.scrollIntoView({block:'nearest'});a.focus({preventScroll:true})}}
mbtn.addEventListener('click',()=>setMenu(mnav.hidden));
curTab.addEventListener('click',()=>setMenu(mnav.hidden));
mscrim.addEventListener('click',()=>setMenu(false));
mnav.addEventListener('click',e=>{const a=e.target.closest('[data-go]');if(!a)return;e.preventDefault();setMenu(false);openWin(a.dataset.go);try{history.replaceState(null,'','#'+a.dataset.go);curHash=a.dataset.go}catch(_){}});
addEventListener('keydown',e=>{if(e.key==='Escape'&&!mnav.hidden){setMenu(false);mbtn.focus()}});
let spyQ=false;
function spy(){spyQ=false;if(!document.body.classList.contains('docmode'))return;let cur=DOC_ORDER[0];
  const wins=document.querySelectorAll('#doc > .win');wins.forEach(w=>{if(w.getBoundingClientRect().top<innerHeight*.35)cur=w.id});
  if(wins.length&&innerHeight+scrollY>=document.documentElement.scrollHeight-2)cur=wins[wins.length-1].id;
  mnav.querySelectorAll('[data-go]').forEach(a=>a.setAttribute('aria-current',String(a.dataset.go===cur)));
  curTab.textContent=WINS[cur]?WINS[cur].title:cur}
addEventListener('scroll',()=>{if(!spyQ){spyQ=true;requestAnimationFrame(spy)}},{passive:true});
requestAnimationFrame(spy);

/* ---------- tonight's moon (real phase) ---------- */
(function(){const syn=29.530588853,ref=Date.UTC(2000,0,6,18,14)/864e5;const age=((Date.now()/864e5-ref)%syn+syn)%syn;
  const k=(1-Math.cos(2*Math.PI*age/syn))/2,wax=age<syn/2,r=8,cx=10,cy=10;
  let lit='';if(k>.98)lit=`<circle cx="10" cy="10" r="8" fill="#F2C14E"/>`;else if(k>.02){const rx=Math.abs(1-2*k)*r;const s1=wax?1:0;const s2=(k<.5)===wax?0:1;
    lit=`<path d="M${cx} ${cy-r} A${r} ${r} 0 0 ${s1} ${cx} ${cy+r} A${rx} ${r} 0 0 ${s2} ${cx} ${cy-r}Z" fill="#F2C14E"/>`}
  const toFull=Math.round(((syn/2-age)+syn)%syn);const txt=k>.98?'full moon tonight':k<.02?'new moon tonight':toFull===0?'full moon tonight':`full moon in ${toFull} day${toFull===1?'':'s'}`;
  $('#phase').innerHTML=`<svg width="15" height="15" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8" fill="#232A3B" stroke="#0C0F15" stroke-width="1.5"/>${lit}</svg><span class="phase-t">${txt}</span>`})();

/* ---------- stars ---------- */
(function(){const s=$('#stars');let seed=7;const rnd=()=>(seed=seed*16807%2147483647)/2147483647;let h='';
  for(let i=0;i<120;i++)h+=`<circle cx="${(rnd()*100).toFixed(2)}%" cy="${(rnd()*100).toFixed(2)}%" r="${(.5+rnd()*1.3).toFixed(2)}" fill="#F4F1EA" opacity="${(.2+rnd()*.6).toFixed(2)}"/>`;s.innerHTML=h})();

let saved=null;try{saved=localStorage.getItem('alex-mode')}catch(e){}
setMode(saved==='doc'?'doc':'desk');
const start=(location.hash||'').slice(1);

else if(start)setTimeout(()=>openWin(start),50);

let wasNarrow=innerWidth<=760;addEventListener('resize',()=>{const n=innerWidth<=760;if(n!==wasNarrow){wasNarrow=n;let m='desk';try{m=localStorage.getItem('alex-mode')||'desk'}catch(e){}setMode(m);if(!n&&!Object.keys(open).length){openWin('hello')}}});
addEventListener('popstate',syncHash);addEventListener('hashchange',syncHash);
})();
