<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="description" content="Alex Vugdragovic: product design portfolio. A drawing QA tool piloted at DPR, and MoonMates, a hackathon win.">

<meta property="og:title" content="Alex Vugdragovic, product design portfolio">
<meta property="og:description" content="A drawing QA tool piloted at DPR, and MoonMates, a hackathon win.">
<meta property="og:image" content="https://alexvugdragovic.com/media/og.png">
<meta property="og:image:width" content="1200">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'%3E%3Ccircle cx='10' cy='10' r='8.5' fill='%230C0F15'/%3E%3Cpath d='M10 1.5 A8.5 8.5 0 0 1 10 18.5 A4 8.5 0 0 0 10 1.5Z' fill='%23F2C14E'/%3E%3C/svg%3E">
<title>Alex Vugdragovic</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&family=Caveat:wght@600;700&display=swap">
<style>
/* One deliberate look: a night-sky desktop, taken from the MoonMates video. */
:root{
  color-scheme:dark;
  --ink:#0C0F15; --screen:#131824; --raise:#1B2130; --line:#2B3345; --line2:#3A4358;
  --paper:#F4F1EA; --paper2:#FBF9F4; --text:#16181F; --sub:#585D69; --muted:#9AA3B5;
  --coral:#FF6B4A; --teal:#3FC1B0; --gold:#F2C14E; --lilac:#B79CFF; --blue:#6FA8FF; --moon:#F1E6BD;
  --display:'Space Grotesk',ui-sans-serif,system-ui,sans-serif;
  --body:'DM Sans',ui-sans-serif,system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --hand:'Caveat','Comic Sans MS',cursive;
  --barH:36px; --taskH:46px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--paper);font:400 15px/1.55 var(--body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.mono{font-family:var(--mono)}
.sky{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(circle at 1px 1px,#1F2636 1.3px,transparent 1.7px) 0 0/22px 22px,radial-gradient(ellipse at 75% 15%,#1A2236 0%,var(--ink) 60%)}
.sky svg{position:absolute;inset:0;width:100%;height:100%}

/* menubar */
.menubar{position:fixed;top:0;left:0;right:0;z-index:50;height:calc(var(--barH) + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 14px 0;
  display:flex;align-items:center;gap:18px;background:var(--paper);color:var(--ink);border-bottom:2px solid var(--ink);font:500 14px var(--body)}
.menubar .brand{display:flex;align-items:center;gap:7px;font:700 16px var(--display)}
.menubar nav{display:flex;gap:16px}
.menubar nav button:hover,.menubar .toggle:hover{text-decoration:underline;text-underline-offset:3px}
.menubar .sp{flex:1}
.menubar .phase{display:flex;align-items:center;gap:6px;font:500 12.5px var(--mono);white-space:nowrap}
.menubar .toggle{font:600 12.5px var(--mono);border:1.5px solid var(--ink);border-radius:6px;padding:3px 9px;background:#fff;white-space:nowrap}

/* taskbar */
.taskbar{position:fixed;left:0;right:0;bottom:0;z-index:50;height:calc(var(--taskH) + env(safe-area-inset-bottom,0px));padding:0 10px env(safe-area-inset-bottom,0px);
  display:flex;align-items:center;gap:8px;background:var(--paper);color:var(--ink);border-top:2px solid var(--ink);font:500 12.5px var(--mono);overflow:hidden}
.taskbar .start{display:flex;align-items:center;gap:7px;font:700 15px var(--display);background:var(--gold);border:2px solid var(--ink);border-radius:7px;padding:4px 12px;box-shadow:2px 2px 0 var(--ink);flex:none}
.taskbar .tabs{display:flex;gap:6px;overflow:hidden;min-width:0}
.taskbar .tab{border:1.5px solid var(--ink);border-radius:6px;padding:4px 10px;background:#fff;white-space:nowrap;flex:none}
.taskbar .tab.min{background:transparent;opacity:.6}
.taskbar .tab.on{background:var(--ink);color:var(--paper)}
.taskbar .sp{flex:1}
.taskbar .credit{white-space:nowrap;opacity:.75}

/* desktop */
.desk{position:fixed;left:0;right:0;top:calc(var(--barH) + env(safe-area-inset-top,0px));bottom:calc(var(--taskH) + env(safe-area-inset-bottom,0px));z-index:1;overflow:hidden}
.icons{position:absolute;left:14px;top:14px;bottom:14px;display:grid;gap:6px;z-index:2;grid-auto-flow:column;grid-template-rows:repeat(auto-fill,88px);align-content:start}
.icon{width:96px;display:flex;flex-direction:column;align-items:center;gap:5px;padding:6px 2px;border-radius:8px;position:relative;user-select:none;-webkit-user-select:none;touch-action:none}
.icons.free{display:block}
.icons.free .icon{position:absolute}
.icon.dragging{z-index:5;opacity:.85;cursor:grabbing}
.ctx{position:fixed;z-index:300;min-width:180px;background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:8px;box-shadow:4px 4px 0 var(--ink);padding:4px;font:500 13px var(--mono)}
.ctx button{display:block;width:100%;text-align:left;padding:7px 10px;border-radius:5px}
.ctx button:hover,.ctx button:focus-visible{background:var(--gold);outline:none}
.icon:hover,.icon.sel{background:rgba(244,241,234,.08)}
.icon span{font:500 12px var(--mono);background:rgba(12,15,21,.85);padding:1px 6px;border-radius:3px;white-space:nowrap}
.icon .badge{position:absolute;top:0;right:6px;font:700 10px var(--mono);background:var(--coral);color:var(--ink);border:1.5px solid var(--ink);border-radius:999px;padding:1px 6px;transform:rotate(8deg)}
.note{position:absolute;z-index:1;font:700 27px/1.05 var(--hand);color:var(--gold)}
.desk-sticky{position:absolute;left:150px;bottom:24px;z-index:1;width:230px;background:var(--gold);color:var(--ink);padding:22px 18px 14px;transform:rotate(3deg);box-shadow:6px 8px 0 rgba(0,0,0,.45);font:700 25px/1.08 var(--hand)}
.desk-sticky::before{content:"";position:absolute;width:86px;height:24px;left:50%;top:-11px;margin-left:-43px;background:rgba(244,241,234,.7);transform:rotate(-4deg)}

/* windows */
.win{--accent:var(--teal);position:absolute;display:flex;flex-direction:column;background:var(--paper2);color:var(--text);border:2px solid var(--paper);border-radius:12px;
  box-shadow:8px 8px 0 var(--accent);overflow:visible;max-width:calc(100% - 20px)}
.win.focus{box-shadow:10px 10px 0 var(--accent)}
.win .bar{flex:none;height:34px;display:flex;align-items:center;gap:7px;padding:0 12px;background:var(--paper);border-bottom:2px solid var(--ink);font:600 13px var(--mono);color:var(--ink);cursor:grab;user-select:none;touch-action:none}
.win .bar:active{cursor:grabbing}
.win .bar .dot{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--ink);flex:none}
.win .bar .ttl{margin-left:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.win .bar .r{margin-left:auto;font-weight:500;opacity:.7;white-space:nowrap}
.win .body{flex:1;overflow:auto;padding:22px 26px 28px;overscroll-behavior:contain}
.win.dark .body{background:var(--screen);color:var(--paper)}
.win.max{left:var(--maxL,8px)!important;top:8px!important;width:calc(100% - var(--maxL,8px) - 18px)!important;height:calc(100% - 26px)!important;max-width:none;max-height:none!important}
.win>.bar{border-radius:10px 10px 0 0}
.win>.body{border-radius:0 0 10px 10px}
.win .rz{position:absolute;z-index:3;touch-action:none}
.win .rz.n{top:-7px;left:10px;right:10px;height:10px;cursor:ns-resize}
.win .rz.s{bottom:-7px;left:10px;right:10px;height:10px;cursor:ns-resize}
.win .rz.e{right:-7px;top:10px;bottom:10px;width:10px;cursor:ew-resize}
.win .rz.w{left:-7px;top:10px;bottom:10px;width:10px;cursor:ew-resize}
.win .rz.ne,.win .rz.nw,.win .rz.se,.win .rz.sw{width:17px;height:17px}
.win .rz.ne{top:-7px;right:-7px;cursor:nesw-resize}.win .rz.sw{bottom:-7px;left:-7px;cursor:nesw-resize}
.win .rz.nw{top:-7px;left:-7px;cursor:nwse-resize}.win .rz.se{bottom:-7px;right:-7px;cursor:nwse-resize}
.win.max .rz{display:none}
.win.resizing,.win.resizing *{user-select:none;-webkit-user-select:none}
.win .bar button.dot{position:relative}
.win .bar:hover button.dot::after,.win .bar button.dot:focus-visible::after{content:attr(data-g);position:absolute;inset:0;display:grid;place-items:center;font:700 10px/1 var(--mono);color:var(--ink)}

/* document mode: same windows, stacked */
.doc{position:relative;z-index:1;padding-block:calc(var(--barH) + 28px + env(safe-area-inset-top,0px)) calc(var(--taskH) + 40px);padding-inline:16px;display:flex;flex-direction:column;align-items:center;gap:34px}
.doc .win{position:relative;width:100%;max-width:820px;left:auto!important;top:auto!important;height:auto!important}
.doc .win .bar{cursor:default}
.doc .win .body{overflow:visible}
body.docmode .desk{display:none}
body:not(.docmode) .doc{display:none}

/* type inside windows */
.k{font:600 12px var(--mono);letter-spacing:1.6px;text-transform:uppercase;color:var(--sub)}
.win.dark .k{color:var(--teal)}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
h1{font-size:40px;line-height:1.02;letter-spacing:-1.2px}
h2{font-size:30px;line-height:1.08;letter-spacing:-.6px}
h3{font-size:19px;line-height:1.25;letter-spacing:-.2px}
p{margin:0;max-width:66ch}
.stack{display:flex;flex-direction:column;gap:14px}
.stack-l{display:flex;flex-direction:column;gap:26px}
.lead{font-size:17px;line-height:1.55}
.hl{background:linear-gradient(transparent 58%,rgba(242,193,78,.55) 58%);padding:0 2px}
.teal{color:#1F8F80}
.pillrow{display:flex;flex-wrap:wrap;gap:8px}
.pill{font:600 12px var(--mono);border:1.5px solid var(--text);border-radius:999px;padding:3px 10px;white-space:nowrap}
.pill.win-p{background:var(--coral);border-color:var(--ink);color:var(--ink)}
.pill.soon{border-style:dashed;color:var(--sub);border-color:var(--sub)}
.btnrow{display:flex;flex-wrap:wrap;gap:10px}
.btn{font:700 14px var(--body);border:2px solid var(--ink);border-radius:9px;padding:8px 14px;background:#fff;box-shadow:3px 3px 0 var(--ink)}
.btn.primary{background:var(--teal)}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
hr.cut{border:0;border-top:2px dashed #D9D3C7;margin:4px 0}
ul.ticks{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;max-width:66ch}
ul.ticks li{padding-left:22px;position:relative}
ul.ticks li::before{content:"";position:absolute;left:2px;top:.55em;width:9px;height:9px;border-radius:50%;background:var(--accent,var(--teal));border:1.5px solid var(--text)}
.handnote{font:700 24px/1.1 var(--hand);color:#B3321A}

/* hello */
.hello-top{display:flex;gap:18px;align-items:center}
.avatar{width:84px;height:84px;border-radius:50%;flex:none;border:4px solid var(--gold);box-shadow:0 0 0 2px var(--text);background:#ddd center/cover}

/* facts grid */
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:2px;background:var(--text);border:2px solid var(--text);border-radius:10px;overflow:hidden}
.facts div{background:var(--paper);padding:10px 12px}
.facts dt{font:600 11px var(--mono);letter-spacing:1.2px;text-transform:uppercase;color:var(--sub)}
.facts dd{margin:2px 0 0;font:600 15px/1.3 var(--body)}

/* case study media */
.hero-media{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:22px;align-items:center}
.vidframe{background:var(--ink);border:2px solid var(--text);border-radius:12px;overflow:hidden;box-shadow:6px 6px 0 var(--coral)}
.vidframe video{display:block;width:100%;aspect-ratio:4/5;background:#000}
.vidframe img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover}
.team{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.team figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.team img{width:100%;max-width:92px;aspect-ratio:1;border-radius:50%;padding:4px;background:var(--c);box-shadow:0 0 0 2px var(--text)}
.team b{font:700 14px var(--display)}
.team small{display:block;font:600 10.5px var(--mono);letter-spacing:.8px;text-transform:uppercase;color:var(--sub)}
.decisions{display:grid;gap:14px}
.decision{border:2px solid var(--text);border-radius:12px;padding:16px 18px;background:var(--paper);display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:start}
.decision .sym{grid-row:span 2;width:44px;height:44px}
.decision p{color:#2A2D35}
.strip{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 12px;scroll-snap-type:x mandatory}
.strip figure{margin:0;flex:none;width:190px;scroll-snap-align:start;display:flex;flex-direction:column;gap:8px}
.strip img{width:100%;border-radius:14px;border:2px solid var(--text);display:block;background:var(--screen)}
.strip figcaption{font-size:13px;line-height:1.4;color:var(--sub)}
.evo{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:start}
.evo figure{margin:0;display:flex;flex-direction:column;gap:8px}
.evo .shot{aspect-ratio:3/4;border-radius:12px;border:2px solid var(--text);overflow:hidden;background:var(--screen)}
.evo .shot img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.evo figcaption b{font:700 15px var(--display);display:block}
.evo figcaption span{font-size:13px;color:var(--sub);line-height:1.4;display:block}
.evo figure.final .shot{box-shadow:5px 5px 0 var(--teal)}
.photos{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;align-items:start}
.photos .wide{grid-column:1/-1}
.photos img{width:100%;display:block;border-radius:10px;border:2px solid var(--text)}
.polaroid{background:#fff;padding:9px 9px 0;box-shadow:4px 5px 0 rgba(0,0,0,.25);transform:rotate(-2deg);border:1px solid #ddd}
.polaroid img{border:0;border-radius:0}
.polaroid p{font:700 22px var(--hand);text-align:center;padding:4px 0 6px}
.uifig{margin:0;display:flex;flex-direction:column;gap:8px}
.uifig figcaption{font-size:13px;line-height:1.45;color:var(--sub);max-width:66ch}
.ui{width:100%;display:block;border:2px solid var(--text);border-radius:10px;background:#fff;box-shadow:5px 5px 0 var(--teal)}
.zoom{cursor:zoom-in}
.uigrid{display:grid;gap:16px}
.uigrid.two-one{grid-template-columns:minmax(0,2fr) minmax(0,1fr);align-items:start}
.diagram-wrap{border:2px solid var(--text);border-radius:12px;background:#fff;padding:8px;overflow-x:auto}
.diagram{display:block;width:100%;min-width:560px;height:auto}
.tablewrap{overflow-x:auto;border:2px solid var(--text);border-radius:12px}
.findings{width:100%;border-collapse:collapse;font-size:14px;line-height:1.45;background:var(--paper);color:var(--text)}
.findings th{font:600 11px var(--mono);letter-spacing:1.2px;text-transform:uppercase;color:var(--sub);text-align:left;padding:10px 14px;background:#ECE7DC;border-bottom:2px solid var(--text)}
.findings td{padding:10px 14px;vertical-align:top;border-top:1px solid #D9D3C7;width:50%}
.findings td:first-child{color:#3A3E48;font-style:italic}
.pill.piloted{background:var(--teal);border-color:var(--ink);color:var(--ink)}
.lb{position:fixed;inset:0;z-index:200;background:rgba(12,15,21,.93);display:flex;align-items:center;justify-content:center;padding:56px 16px 24px}
.lb img{max-width:100%;max-height:100%;border-radius:8px;border:2px solid var(--paper);background:#fff}
.lb button{position:absolute;top:12px;right:16px}
.small-note{font-size:13px;color:var(--sub)}
.strip.wide figure{width:340px}
.strip.wide{align-items:flex-start}
.strip.wide img{border-radius:10px;background:#fff;height:220px;object-fit:cover;object-position:top left}
.strip img.zoom{cursor:zoom-in}
.users{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.user{border:2px solid var(--text);border-radius:12px;background:var(--paper);padding:14px;display:flex;flex-direction:column;gap:6px;box-shadow:4px 4px 0 var(--c)}
.user .ic{width:34px;height:34px;border-radius:50%;background:var(--c);border:2px solid var(--text);display:grid;place-items:center;font:700 15px var(--display)}
.user b{font:700 16px var(--display)}
.user p{font-size:13.5px;line-height:1.45;color:#3A3E48}
.changes{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.chg{border:2px solid var(--text);border-radius:12px;background:var(--paper);padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.chg p{font-size:13.5px;line-height:1.45}
.chg p:nth-of-type(1){font-style:italic;color:#3A3E48}
.chg .k{font-size:10.5px}
.chg .k.to{color:#1F8F80;margin-top:4px}
.qa-anim{position:relative;aspect-ratio:4/5;max-width:100%;background:var(--screen);border:2px solid var(--text);border-radius:12px;box-shadow:6px 6px 0 var(--teal);padding:14px;display:flex;flex-direction:column;gap:8px;overflow:hidden;color:var(--paper)}
.qa-anim .lab{font:600 10.5px var(--mono);letter-spacing:1.4px;text-transform:uppercase;color:var(--muted)}
.qa-anim .lab.after{color:var(--teal)}
.qa-anim .mails{position:relative;height:118px}
.qa-anim .mail{position:absolute;left:0;right:0;display:flex;gap:8px;align-items:center;background:#232A3B;border:1px solid var(--line2);border-radius:8px;padding:6px 9px;font:500 11.5px var(--mono);white-space:nowrap;overflow:hidden;animation:qa-mail 6s ease-in-out infinite}
.qa-anim .mail i{flex:none;width:16px;height:11px;border:1.5px solid var(--muted);border-radius:2px;background:linear-gradient(155deg,transparent 45%,var(--muted) 46%,var(--muted) 54%,transparent 55%),linear-gradient(25deg,transparent 45%,var(--muted) 46%,var(--muted) 54%,transparent 55%)}
.qa-anim .m1{top:0;transform:rotate(-2deg)}
.qa-anim .m2{top:28px;left:14px;transform:rotate(2deg);animation-delay:.15s}
.qa-anim .m3{top:56px;left:4px;transform:rotate(-1deg);animation-delay:.3s}
.qa-anim .m4{top:84px;left:20px;transform:rotate(1.5deg);animation-delay:.45s}
.qa-anim .cost{align-self:flex-start;font:700 11px var(--mono);background:var(--coral);color:var(--ink);border-radius:999px;padding:3px 9px}
.qa-anim .list{flex:1;background:var(--paper);color:var(--text);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px}
.qa-anim .row{display:flex;gap:8px;align-items:center;font:500 11.5px var(--body)}
.qa-anim .row b{flex:none;width:16px;height:16px;border-radius:4px;border:2px solid var(--text);background:#fff;animation:qa-tick 6s infinite}
.qa-anim .row.bad b{animation-name:qa-fail}
.qa-anim .r2 b{animation-delay:.35s}.qa-anim .r3 b{animation-delay:.7s}.qa-anim .r4 b{animation-delay:1.05s}
.qa-anim .report{margin-top:auto;align-self:flex-start;font:700 11px var(--mono);background:var(--teal);color:var(--ink);border:2px solid var(--text);border-radius:8px;padding:5px 9px;animation:qa-pop 6s infinite}
@keyframes qa-mail{0%,8%{opacity:1}30%,70%{opacity:.35;filter:blur(.6px)}92%,100%{opacity:1}}
@keyframes qa-tick{0%,30%{background:#fff}38%,88%{background:#3FC1B0}96%,100%{background:#fff}}
@keyframes qa-fail{0%,30%{background:#fff}38%,88%{background:#FF6B4A}96%,100%{background:#fff}}
@keyframes qa-pop{0%,52%{transform:scale(.4);opacity:0}60%{transform:scale(1.12);opacity:1}66%,88%{transform:scale(1);opacity:1}96%,100%{transform:scale(.4);opacity:0}}
@media (prefers-reduced-motion:reduce){.qa-anim .row b{background:#3FC1B0}.qa-anim .row.bad b{background:#FF6B4A}.qa-anim .report{opacity:1;transform:none}}
.cmp2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.cmp2>div{display:flex;flex-direction:column;gap:10px;border-radius:14px;padding:18px 18px 16px}
.cmp-a{background:#E6E1D5;border:2px solid #D2CBBB}
.cmp-b{background:var(--screen);color:var(--paper);border:2px solid var(--teal)}
.cmp-b .k{color:var(--teal)}
.cmp-b h3{color:var(--teal)}
.cmp-b ul.ticks li::before{border-color:var(--paper)}
.reflect{background:var(--gold);color:var(--ink);padding:18px 18px 14px;transform:rotate(-.6deg);box-shadow:5px 6px 0 rgba(0,0,0,.2);font:700 23px/1.15 var(--hand);max-width:520px}

<template id="t-moonmates">
  <article class="stack-l">
    <header class="stack" style="gap:10px">
      <div class="pillrow"><span class="pill win-p">Winner</span><span class="pill">Engine by Starling challenge</span><span class="pill">HuddleHive Hack 2026</span></div>
      <h1>MoonMates</h1>
      <p class="lead">An app for the friends you keep meaning to see. Your circle saves a little every day into a shared pot, a moon fills up as the balance grows, and when it's full the app suggests a time and place that already fit everyone's week.</p>
    </header>

    <dl class="facts">
      <div><dt>Team</dt><dd>5 people</dd></div>
      <div><dt>Time</dt><dd>24 hours</dd></div>
      <div><dt>My role</dt><dd>Product &amp; design</dd></div>
      <div><dt>APIs</dt><dd>Engine core + TfL</dd></div>
    </dl>

    <div class="hero-media">
      <div class="vidframe"><video src="media/moonmates.mp4" poster="media/poster.jpg" autoplay muted loop playsinline aria-label="MoonMates in 13 seconds: friends save daily, cross paths on the Tube, the moon fills up and turns into pizza night"></video></div>
      <div class="stack">
        <span class="k">The brief</span>
        <h3>“Connect a mock Engine core to an unexpected, non-banking API and create a brand new financial service.”</h3>
        <p>We paired Engine by Starling with Transport for London. Engine Spaces hold the shared pot, and TfL data finds where your routes already cross, so nobody has to trek across the city.</p>
      </div>
    </div>

    <hr class="cut">

    <section class="stack">
      <span class="k">01 · Context &amp; problem</span>
      <h2>Friends don't drift apart on purpose</h2>
      <p>Plans stall in the group chat. Picking a date, agreeing where to meet and splitting the bill all take effort, and saving on your own rarely sticks. We spent the first hours narrowing this down, because choosing the problem was the hardest part of the brief.</p>
    </section>

    <section class="stack">
      <span class="k">02 · My role</span>
      <h2>Product and design, from the first sketch to the pitch</h2>
      <div class="team">
        <figure style="--c:#FF6B4A"><img src="media/maya.png" alt="Avatar of Maya"><figcaption><b>Maya</b><small>Engineer</small></figcaption></figure>
        <figure style="--c:#3FC1B0"><img src="media/lena.png" alt="Avatar of Lena"><figcaption><b>Lena</b><small>Engineer</small></figcaption></figure>
        <figure style="--c:#F2C14E"><img src="media/alex.png" alt="Alex"><figcaption><b>Alex (me)</b><small>Product &amp; design</small></figcaption></figure>
        <figure style="--c:#B79CFF"><img src="media/sofia.png" alt="Avatar of Sofia"><figcaption><b>Sofia</b><small>Designer</small></figcaption></figure>
        <figure style="--c:#6FA8FF"><img src="media/nina.png" alt="Avatar of Nina"><figcaption><b>Nina</b><small>Product manager</small></figcaption></figure>
      </div>
      <p class="small-note">My teammates appear here as avatars with made-up names.</p>
      <ul class="ticks">
        <li>I facilitated our ideation with a Crazy Eights session, then we cut the ideas down until the strongest were left.</li>
        <li>I researched the problem from the start, since narrowing it down was our main bottleneck.</li>
        <li>I explored which APIs to combine and went to Starling engineers and the judges early for feedback.</li>
        <li>I built and pitched several prototypes in Claude Code, then pitched the chosen concept to the team as a clickable prototype: problem, process, technical background and solution.</li>
        <li>My prototype's visual language became the product UI, which the team refined for the final pitch.</li>
        <li>I designed the logo and reworked our submission document, effectively a PRD, within the 24 hours.</li>

    <section class="stack">
      <span class="k">03 · Key decisions</span>
      <h2>Decisions that shaped the product</h2>
      <div class="decisions">
        <div class="decision">
          <svg class="sym" viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="18" fill="#232A3B" stroke="#16181F" stroke-width="2"/><path d="M22 4 A18 18 0 0 1 22 40 A8 18 0 0 0 22 4Z" fill="#F1E6BD" stroke="#16181F" stroke-width="2"/></svg>
          <h3>Let the moon set the rhythm</h3>
          <p>Agreeing on a date is often where plans stall. A 30-day lunar cycle gives everyone the same deadline without anyone negotiating it, and watching the moon fill up makes slow saving visible.</p>
        </div>
        <div class="decision">
          <svg class="sym" viewBox="0 0 44 44" aria-hidden="true"><path d="M4 34 C 14 30, 18 18, 22 22 S 30 12, 40 8" fill="none" stroke="#3FC1B0" stroke-width="4" stroke-linecap="round"/><path d="M6 8 C 16 14, 26 26, 40 36" fill="none" stroke="#6FA8FF" stroke-width="4" stroke-linecap="round"/><circle cx="22" cy="22" r="5" fill="#F4F1EA" stroke="#16181F" stroke-width="2"/></svg>
          <h3>Meet where your weeks already cross</h3>
          <p>Crossed Paths suggests a spot where everyone's week already overlaps, so nobody crosses the city. In the demo the TfL patterns were mocked. Reflections below explain why, and how we'd build it for real.</p>
        </div>
        <div class="decision">
          <svg class="sym" viewBox="0 0 44 44" aria-hidden="true"><rect x="4" y="10" width="36" height="24" rx="5" fill="#3FC1B0" stroke="#16181F" stroke-width="2"/><rect x="9" y="25" width="12" height="3" rx="1.5" fill="#16181F"/></svg>
          <h3>Make saying yes effortless</h3>
          <p>When the moon is full, the app drafts the invite and four out of five yeses books the table. A single-use virtual card is ready on the night, and anything left over stays in the Space so the next moon starts ahead.</p>
        </div>

    <section class="stack">
      <span class="k">04 · How the idea evolved</span>
      <h2>From a coffee pot to a moon</h2>
      <p>I prototyped two earlier ideas before MoonMates. Coffee Pot put 10p aside every time you bought a coffee alone, towards a coffee with a friend. The judges told us the problem wasn't clear and asked if we knew anyone who would use it. After that we stopped tying the idea to coffee, because the pot could pay for any night out, from pizza to bowling. Full Moon Pizza turned saving into a monthly ritual inside a bank's Spaces. MoonMates kept the ritual, added the friends and a place to meet, and lets the circle pick what they save for.</p>
      <div class="evo">

      <span class="k">07 · Reflections</span>
      <h2>What I'd do differently: bring privacy in on day one</h2>
      <p>Midway through the weekend I looked into what data TfL shares. Its Unified API only has open network data: lines, stations, arrivals and journey planning. It has no journey history, because that is personal data under UK GDPR, and weekly patterns show where people live and work.</p>

<template id="t-careloop">
  <article class="stack-l">
    <header class="stack" style="gap:10px">
      <div class="pillrow"><span class="pill win-p">Winner</span><span class="pill">Accurx challenge</span><span class="pill">HuddleHive NHS Hackathon 2026</span></div>
      <h1>CareLoop</h1>
      <p class="lead">A voice-first symptom diary for patients waiting for specialist care. Patients say how they feel instead of typing it, CareLoop fills in the GP form for them, and the practice can see when someone is getting worse.</p>
    </header>

    <dl class="facts">
      <div><dt>Team</dt><dd>5 people</dd></div>
      <div><dt>Time</dt><dd>24 hours</dd></div>
      <div><dt>My role</dt><dd>Product &amp; project lead</dd></div>
      <div><dt>Built with</dt><dd>Claude Code</dd></div>
    </dl>

    <div class="hero-media">
      <div class="vidframe" style="box-shadow:6px 6px 0 var(--blue)"><img src="media/careloop_hero.jpg" alt="CareLoop on a phone: the patient records how they feel and Scribe transcribes it"></div>
      <div class="stack">
        <span class="k">The idea</span>
        <h3>Saying how you feel is easier than filling in a form when you're unwell.</h3>
        <p>Patients waiting for a specialist are often asked to keep a symptom diary. CareLoop lets them talk instead of type, then turns what they said into the eConsult form their GP practice already uses.</p>
      </div>
    </div>

    <hr class="cut">

    <section class="stack">
      <span class="k">01 · Context &amp; problem</span>
      <h2>Patients are told to track symptoms, with nowhere to do it</h2>
      <p>We chose the problem after talking to the hackathon coordinators. One of them works at Accurx and told us what the company struggles with, and about her own experience of the NHS. Together with NHS waiting list data, that pointed to three problems.</p>
      <ul class="ticks" style="--accent:var(--blue)">
        <li>Patients waiting for an appointment are told to track their symptoms, but there is no system to do it in.</li>
        <li>Patients repeat their symptoms to every NHS service they see.</li>
        <li>Clinicians get scattered information and see one snapshot, even when the patient has seen several professionals since the last visit.</li>
      </ul>
      <p>Writing a symptom down means stopping, opening a form and typing, often when you feel worst. In our prototype the patient is waiting 84 days for a cardiology appointment, so the diary is also how the GP practice would notice if they got worse.</p>
    </section>

    <section class="stack">
      <span class="k">02 · My role</span>
      <h2>Product and project lead, and I built the prototype</h2>
      <ul class="ticks" style="--accent:var(--blue)">
        <li>I led a team of five from the problem to a working AI prototype in 24 hours.</li>
        <li>I ran the ideation. After the conversations with the coordinators we picked a few problems and narrowed them down to one.</li>
        <li>Once we had the problem, I built a quick prototype in Claude Code. The team followed its UI to the end.</li>
      </ul>
    </section>

    <section class="stack">
      <span class="k">03 · Key decisions</span>
      <h2>Decisions that shaped the product</h2>
      <div class="decisions">
        <div class="decision">
          <svg class="sym" viewBox="0 0 44 44" aria-hidden="true"><rect x="15" y="5" width="14" height="22" rx="7" fill="#FF6B4A" stroke="#16181F" stroke-width="2"/><path d="M9 20a13 13 0 0 0 26 0M22 33v6M15 39h14" fill="none" stroke="#16181F" stroke-width="2.5" stroke-linecap="round"/></svg>
          <h3>Let patients talk</h3>
          <p>Typing is the barrier, so voice is the main input. Patients can speak while lying down or holding the phone in one hand, and anyone who prefers typing can switch.</p>
        </div>
        <div class="decision">
          <svg class="sym" viewBox="0 0 44 44" aria-hidden="true"><rect x="6" y="5" width="32" height="34" rx="4" fill="#FBF9F4" stroke="#16181F" stroke-width="2"/><rect x="11" y="11" width="22" height="6" rx="2" fill="#6FA8FF" stroke="#16181F" stroke-width="1.5"/><rect x="11" y="21" width="22" height="6" rx="2" fill="#6FA8FF" stroke="#16181F" stroke-width="1.5"/><path d="M12 33h12" stroke="#16181F" stroke-width="2" stroke-linecap="round"/></svg>
          <h3>Fill in the form the GP already uses</h3>
          <p>Scribe maps what the patient says onto NHS eConsult fields, so the practice gets a format it already reads. The patient checks and edits every field before anything is sent.</p>
        </div>
        <div class="decision">
          <svg class="sym" viewBox="0 0 44 44" aria-hidden="true"><rect x="5" y="24" width="34" height="14" rx="4" fill="#3FC1B0" stroke="#16181F" stroke-width="2"/><rect x="11" y="8" width="22" height="14" rx="4" fill="#6FA8FF" stroke="#16181F" stroke-width="2"/></svg>
          <h3>Build on Scribe instead of competing with it</h3>
          <p>Halfway through the build we found out Accurx already had Scribe, an AI transcription tool used in consultations. We reframed CareLoop as an extension of it: the same transcription, pointed at the patient and used across weeks rather than one appointment.</p>
        </div>
      </div>
    </section>

    <section class="stack">
      <span class="k">04 · The prototype</span>
      <h2>From a voice note to an escalation flag</h2>
      <div class="strip" tabindex="0" aria-label="CareLoop screens, scroll sideways. Click a screen to enlarge it.">
        <figure><img class="zoom" src="media/careloop_01.png" alt="Start screen: Tell us how you're feeling" loading="lazy"><figcaption>Start by talking. Typing is one tap away.</figcaption></figure>
        <figure><img class="zoom" src="media/careloop_02.png" alt="Recording with a live transcript" loading="lazy"><figcaption>Scribe transcribes as the patient talks.</figcaption></figure>
        <figure><img class="zoom" src="media/careloop_03.png" alt="Scribe mapping clinical keywords to eConsult fields" loading="lazy"><figcaption>Scribe picks out the clinical details and maps them to eConsult fields.</figcaption></figure>
        <figure><img class="zoom" src="media/careloop_04.png" alt="Review your form with six pre-filled fields" loading="lazy"><figcaption>The patient checks every pre-filled field before sending.</figcaption></figure>
        <figure><img class="zoom" src="media/careloop_05.png" alt="Sent to your GP practice, with a reference number" loading="lazy"><figcaption>The form goes to the GP practice with a reference number.</figcaption></figure>
        <figure><img class="zoom" src="media/careloop_06.png" alt="Patient view of the symptom journal" loading="lazy"><figcaption>While waiting for cardiology, the patient keeps logging symptoms.</figcaption></figure>
        <figure><img class="zoom" src="media/careloop_07.png" alt="Practice view with an escalation flag" loading="lazy"><figcaption>The practice sees an escalation flag when severity rises.</figcaption></figure>
        <figure><img class="zoom" src="media/careloop_08.png" alt="Practice view with the severity trend and entries" loading="lazy"><figcaption>The severity trend and every entry in one view.</figcaption></figure>
        <figure><img class="zoom" src="media/careloop_09.png" alt="Symptom timeline with the GP escalation" loading="lazy"><figcaption>The timeline shows when the GP escalation was raised.</figcaption></figure>
      </div>
    </section>

    <section class="stack">
      <span class="k">05 · Edge cases</span>
      <h2>The practice gets a flag, but nothing tells the patient to call 999</h2>
      <h3>Handled in the prototype</h3>
      <ul class="ticks" style="--accent:var(--blue)">
        <li>Some patients can't or won't talk to an app, so typing is one tap away on the first screen.</li>
        <li>Scribe can get a field wrong, so the patient checks and edits every pre-filled field before anything is sent.</li>
        <li>When severity rises between entries, the practice sees an escalation flag with the reason.</li>
      </ul>
      <h3>What I'd design next</h3>
      <p class="small-note">Designed after the hackathon. Not built, and not tested with patients or clinicians.</p>
      <p>In our demo the patient's last entry is "sharp chest pain radiating to left arm" at severity 9, with breathlessness at rest. The practice gets a flag that recommends an urgent review. On the patient's side, nothing says this could be an emergency. We didn't look at this case during the hackathon.</p>
      <div class="strip" tabindex="0" aria-label="The escalation flag in the prototype next to a concept screen for the patient. Click a screen to enlarge it.">
        <figure><img class="zoom" src="media/careloop_07.png" alt="Practice view with an escalation flag that recommends an urgent review" loading="lazy"><figcaption><b>In the prototype.</b> The practice sees the flag.</figcaption></figure>
        <figure><img class="zoom" src="media/careloop_10_emergency.png" alt="Concept screen for the patient: the entry is paused and the patient is told to call 999, with a second option to call 111" loading="lazy"><figcaption><b>Concept, not built.</b> The patient is told to call 999 as soon as Scribe hears the symptoms.</figcaption></figure>
      </div>
      <p>A flag waits until someone at the practice reads it, and that is too slow for these symptoms. So the first screen I'd add is for the patient. When Scribe hears red-flag symptoms, CareLoop pauses the entry and tells the patient to call 999.</p>
      <ul class="ticks" style="--accent:var(--blue)">
        <li>The entry is still saved and flagged, and the screen says so. It also says not to wait for the practice to reply, because a patient could assume that logging a symptom means someone is already looking at it.</li>
        <li>Transcription can be wrong, so the patient can say that isn't what they said and carry on. The practice would see that they did.</li>
        <li>Which symptoms count as red flags, and the wording, would have to come from clinicians rather than from me.</li>
      </ul>
      <p>Two more cases I'd look at after that. If the diary goes quiet for weeks, the patient could be fine or much worse, and the practice can't tell which. If a carer logs for the patient, the entry should say who recorded it.</p>
    </section>

    <section class="stack">
      <span class="k">06 · Outcome</span>
      <h2>We won the Accurx challenge</h2>
      <p>We pitched a working prototype after 24 hours. It was judged in the room and no patient has used it, so it shows how I scope and decide under time pressure, not that the product works.</p>
    </section>

    <section class="stack">
      <span class="k">07 · Reflections</span>
      <h2>What I'd do differently</h2>
      <ul class="ticks" style="--accent:var(--gold)">
        <li>Test the voice assumption. Many patients on long waiting lists are older, and we never checked whether they would want to talk to an app.</li>
        <li>Ask a GP about the flags. A timeline means more information for clinicians who are already busy, and I'd want to know if it helps them or adds to the pile.</li>
        <li>Look at the challenge partner's products before ideation, not halfway through the build.</li>
      </ul>
    </section>
  </article>
</template>

    <header class="stack" style="gap:10px">

      <h1>Cow Compass</h1>
      <p class="lead">A herd tracker for small farms where the signal comes and goes. It started when my family's bulls went missing for nearly two weeks. I interviewed four farming households in rural Croatia and designed a clickable prototype for the moment a cow gets out.</p>

L56 320Z" fill="rgba(255,251,239,.22)" stroke="#FFFBEF" stroke-width="7" stroke-linejoin="round"/><path d="M70 175L180 150L300 150L338 250L322 385L205 440L112 425L56 320Z" fill="none" stroke="#17200F" stroke-width="2" stroke-dasharray="7 6" stroke-linejoin="round"/><g fill="#FFFBEF" stroke="#17200F" stroke-width="1.6"><circle cx="70" cy="175" r="3.6"/><circle cx="180" cy="150" r="3.6"/><circle cx="300" cy="150" r="3.6"/><circle cx="338" cy="250" r="3.6"/><circle cx="322" cy="385" r="3.6"/><circle cx="205" cy="440" r="3.6"/><circle cx="112" cy="425" r="3.6"/><circle cx="56" cy="320" r="3.6"/></g><g font-family="IBM Plex Mono, monospace" font-size="10" font-weight="600" letter-spacing="1.2"><text x="300" y="196" fill="#FFFBEF">FOREST</text><text x="274" y="346" fill="#17200F" opacity=".7">WATER</text><text x="226" y="454" fill="#17200F" opacity=".6">NORTH FIELD</text></g><path class="cc-trail" d="" fill="none" stroke="#FF5A36" stroke-width="3" stroke-dasharray="2 7" stroke-linecap="round"/><g transform="translate(180 150)"><rect x="-13" y="-6" width="26" height="12" rx="3" fill="#F2B33A" stroke="#17200F" stroke-width="1.6"/><text y="-12" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="9.5" font-weight="600" fill="#17200F">NORTH GATE</text></g><g class="cc-cows"></g></svg><div class="cc-card" aria-hidden="true"><span class="dot"></span><span><b>All 16 cows are safe</b><small>North field · updated just now</small></span></div></div>
      <div class="stack">
        <span class="k">The idea</span>
        <h3>When a cow gets out, the farmer needs to know where she is, how old that position is, and how to reach her.</h3>
        <p>Cow Compass answers those three things on one screen. It keeps working when the phone loses signal, because on a hill farm that happens all the time.</p>
        <div class="btnrow"><a class="btn primary" data-proto href="cow-compass/" target="_blank" rel="noopener">Try the prototype</a></div>
      </div>
    </div>

    <hr class="cut">

    <section class="stack">
      <span class="k">01 · Context &amp; problem</span>
      <h2>Small farms lose animals and look for them the old way</h2>
      <p>In spring 2024 two bulls got out of my family's farm and were missing for nearly two weeks. My parents and the neighbours searched for them and lost time and money. The bulls damaged nearby properties, and when they were found they were thinner, stressed and confused. My family said they wished they had something that could track them.</p>
      <p>That became the problem I wanted to understand. Farmers struggle to keep track of their animals and to get them back when they escape, and every escape costs money, time and stress.</p>
      <p>Farms like ours are common. About 90% of the world's 570 million farms are run by families. In Croatia, 69.5% of farms are smaller than 5 hectares and a third of farm managers are 65 or older. In rural parts of the EU, fewer than half of people have basic digital skills. Livestock trackers on the market are built for large commercial herds, priced per collar with a monthly fee.</p>
      <p class="small-note">Sources: <a href="https://openknowledge.fao.org/items/0c402799-d523-4164-b953-75f262fb7fbe" target="_blank" rel="noopener">FAO, The State of Food and Agriculture 2014</a>. <a href="https://ec.europa.eu/eurostat/documents/2995521/9028470/5-28062018-AP-EN.pdf" target="_blank" rel="noopener">Eurostat, Farm Structure Survey 2016</a>. <a href="https://ec.europa.eu/eurostat/statistics-explained/index.php?title=Urban-rural_Europe_-_digital_society" target="_blank" rel="noopener">Eurostat, Urban-rural Europe: digital society, 2023</a>.</p>
    </section>

    <section class="stack">
      <span class="k">02 · Research</span>
      <h2>I talked to four farming households</h2>
      <p>I interviewed farmers in Gornji Skrad and Lasinjski Sjeničak, two villages in rural Croatia. They keep bulls, cows and calves, between 5 and 20 animals. Some use apps every day and others farm without them. Today they find their animals by looking, by listening for the bell, with food as bait, with help from neighbours and with fences.</p>
      <h3>What they told me</h3>
      <ul class="ticks" style="--accent:#7DC46A">
        <li>Animals get out and move unpredictably, and nobody knows where they are until someone finds them.</li>
        <li>A search brings panic and helplessness, and the fear that the animal will hurt someone or damage a neighbour's property.</li>
        <li>Searching means long walks over rough ground, sometimes every day.</li>
        <li>They rely on other people and old methods, and they want a better way to track their animals.</li>
        <li>An animal that has been out loses weight or gets hurt, and a small farm feels every loss.</li>
      </ul>
      <p>From the interviews I made one persona: a small-scale farmer, 50, with a herd of 5 to 25 cows in a remote village with poor signal and little technology.</p>
      <h3>What's on the market</h3>
      <p>I looked at eShepherd by Gallagher, Nofence, mOOvement and Monil. Some of what they do well made it into my prototype: map views farmers already know, night-time battery saving and alerts about the collars themselves. They are built for commercial herds in developed markets, and cost is where smallholders stop. One small farmer wrote online that a $60 tag already hurts.</p>
      <p>My SWOT turned into three decisions for the concept.</p>
      <ul class="ticks" style="--accent:#7DC46A">
        <li>Keep the first version to animal safety and escape alerts rather than heavy analytics.</li>
        <li>Design for poor connectivity from the start, because a weak signal is normal in these villages.</li>
        <li>Treat the collar as a dependency I don't control, and be honest on screen about what it can and can't see.</li>
      </ul>
    </section>

    <section class="stack">
      <span class="k">03 · Journey map and user flow</span>
      <h2>Following Daisy from the alert to the log</h2>
      <p>I mapped one escape, Daisy, cow number 7, from a normal morning to the moment the farmer looks back on it. Every stage has what the farmer is thinking and the opportunity for the app.</p>

    <section class="stack">
      <span class="k">04 · From paper to prototype</span>
      <h2>Sketches first, then lo-fi wireframes</h2>
      <p>I sketched on paper first. My offline sketches show the dashboard when the connection drops: the time of the last sync, the last known status of each animal, and a note that live updates are paused. The animal status sketch lets the farmer log a manual check, add a voice memo, and see it queued for upload. Then I drew lo-fi wireframes in FigJam for the escape.</p>
      <div class="strip" tabindex="0" aria-label="Sketches and wireframes, scroll sideways. Click one to enlarge it.">
        <figure style="width:240px"><img class="zoom" src="media/cowcompass_sketch_offline.jpg" alt="Paper sketch of offline mode: no connection, last sync 7:54, live updates are paused, the app keeps the last known status of each animal" loading="lazy"><figcaption>Offline mode on paper. Last sync, last known status, and a note that live updates are paused.</figcaption></figure>
        <figure style="width:240px"><img class="zoom" src="media/cowcompass_sketch_status.jpg" alt="Paper sketch of animal status: last location, activity summary, a pop-up that real time updates are unavailable, and a manual check with a voice memo queued for upload" loading="lazy"><figcaption>Animal status. Without signal the farmer can still log a check, and it waits for upload.</figcaption></figure>
        <figure style="width:340px"><img class="zoom" src="media/cowcompass_lofi_wireframes.jpg" alt="Three lo-fi wireframes: the push notification Daisy left the boundary, the map centred on the lost cow about 1 km away, and the route to her 38 metres away" loading="lazy"><figcaption>Lo-fi wireframes in FigJam. The alert, the map centred on the lost cow, and the route to her.</figcaption></figure>
      </div>
      <p>In 2026 I built a clickable prototype from these with Claude Code, with a playful look of its own: an illustrated farm with a road, a forest, a stream and sixteen cows that graze and wander.</p>
    </section>

    <section class="stack">
      <span class="k">05 · Key decisions</span>
      <h2>Decisions that shaped the prototype</h2>
      <div class="decisions">
        <div class="decision"><svg class="sym" viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="17" fill="#7DC46A" stroke="#16181F" stroke-width="2"/><path d="m14 22.5 5.5 5.5L30 17" fill="none" stroke="#16181F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><h3>Answer the first question first</h3><p>My dashboard sketches started from what a farmer asks in the morning: are my animals safe, does anything need me now, what happened overnight. The Today screen opens with one answer, all 16 safe or who is out, before any map or list.</p></div>
        <div class="decision"><svg class="sym" viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="17" fill="#E6E9F3" stroke="#16181F" stroke-width="2"/><path d="M22 12v10l7 5" fill="none" stroke="#16181F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg><h3>Show how old every position is</h3><p>A position from 40 minutes ago looks like a live one unless the app says so. Every position carries a time. A cow that isn't live turns grey, and the wording changes from “updated” to “seen”, as in my wireframes.</p></div>
        <div class="decision"><svg class="sym" viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="17" fill="#FBF9F4" stroke="#16181F" stroke-width="2"/><path d="M22 8 27 22 22 36 17 22Z" fill="#6E7AA0" stroke="#16181F" stroke-width="1.8" stroke-linejoin="round"/><circle cx="22" cy="22" r="2.6" fill="#16181F"/></svg><h3>Keep the walk going without signal</h3><p>A phone's GPS works without mobile signal, and my notes planned for maps downloaded on wifi. So when the signal drops, the compass keeps pointing at Daisy's last known spot. It turns grey, says which time it points to, and draws a circle around that spot that grows every minute. The farmer can see how sure the app is without reading anything, the way a map app shows how accurate your own position is.</p></div>
        <div class="decision"><svg class="sym" viewBox="0 0 44 44" aria-hidden="true"><rect x="15" y="5" width="14" height="22" rx="7" fill="#7DC46A" stroke="#16181F" stroke-width="2"/><path d="M9 20a13 13 0 0 0 26 0M22 33v6M15 39h14" fill="none" stroke="#16181F" stroke-width="2.5" stroke-linecap="round"/></svg><h3>Log it in ten seconds</h3><p>After an escape the farmer taps a reason, records a voice note or skips. Everything is saved on the phone first and sent when there is signal. The log is what makes patterns possible later, like three escapes at the same gate. The five reasons in the prototype are my placeholders, and the real ones will come from farmers.</p></div>
        <div class="decision"><svg class="sym" viewBox="0 0 44 44" aria-hidden="true"><path d="M11 31V21a11 11 0 0 1 22 0v10l3 4H8Z" fill="#F2C14E" stroke="#16181F" stroke-width="2" stroke-linejoin="round"/><path d="M18 38a4 4 0 0 0 8 0" fill="none" stroke="#16181F" stroke-width="2"/></svg><h3>Only alert for real problems</h3><p>Cows graze right along the fence and push their heads through for grass, and GPS wobbles by a few metres. So near the fence the app waits two minutes before calling it an escape, a number I'd tune from how often a collar jumps the line when the cow hasn't left. A cow that is clearly out alerts straight away. Two cows that leave together get one alert, because if you find one, the other is there too. A low collar battery waits for a sensible moment.</p></div>
        <div class="decision"><svg class="sym" viewBox="0 0 44 44" aria-hidden="true"><circle cx="13" cy="13" r="8" fill="#2C9A58" stroke="#16181F" stroke-width="2"/><circle cx="31" cy="13" r="8" fill="#E9A21F" stroke="#16181F" stroke-width="2"/><circle cx="13" cy="31" r="8" fill="#FF5A36" stroke="#16181F" stroke-width="2"/><circle cx="31" cy="31" r="8" fill="#6E7AA0" stroke="#16181F" stroke-width="2"/></svg><h3>One set of state colours</h3><p>Green is safe, amber needs a look, red is an escape and grey is a position that isn't live. The colours mean the same thing on every screen and stay separate from the playful drawing around them, and the dark outlines hold up in sunlight. For a bigger herd I'd group cows into clusters, as some of the products I looked at do.</p></div>
      </div>
    </section>

    <section class="stack">
      <span class="k">07 · States &amp; edge cases</span>
      <h2>Not every alert is an escape</h2>
      <h3>Handled in the prototype</h3>
      <ul class="ticks" style="--accent:#7DC46A">
        <li>A collar goes quiet in a dip where it can't reach the network. The cow shows as last seen, with the time, until it reports again.</li>
        <li>A cow stands right on the fence line. GPS can be off by a few metres, so the app waits two minutes before it calls an escape. If she is clearly outside, the alert comes straight away.</li>
        <li>Two cows leave together. They get one alert and one route.</li>
        <li>A cow heads for a hazard. Farmers already know where their animals go when they get out, so they mark those places on the map once: the road, a river, someone else's crops. A cow near one is the most urgent alert, with a button to call a neighbour who is closer.</li>
        <li>At night the collars save battery and report their position every 30 minutes. The boundary is loaded onto each collar, which checks it on its own, so an escape at 2 am still wakes the farmer straight away.</li>
        <li>A collar battery runs low. The app offers to remind the farmer at the evening feed.</li>
        <li>A cow stays still and on her own, away from the herd, for longer than is usual for her. She could be calving or hurt, so she gets a calm amber nudge. Cows lie down for hours, so stillness alone would ring every night.</li>
        <li>The signal drops on any screen. Positions turn grey with a time, actions wait on the phone, and when the signal comes back the app says what changed.</li>
      </ul>
      <div class="strip" tabindex="0" aria-label="Edge case screens, scroll sideways. Click a screen to enlarge it.">
        <figure><img class="zoom" src="media/cowcompass_e_stale.jpg" alt="Bella’s collar has gone quiet, last seen 47 minutes ago" loading="lazy"><figcaption>A quiet collar shows as last seen.</figcaption></figure>
        <figure><img class="zoom" src="media/cowcompass_e_fence.jpg" alt="Gemma is right on the fence line, watching, 1 minute 40 left" loading="lazy"><figcaption>On the fence line. Two minutes before it counts as an escape.</figcaption></figure>
        <figure><img class="zoom" src="media/cowcompass_e_together.jpg" alt="Lenna and Femke are out together, one alert for both" loading="lazy"><figcaption>Two out together, one alert.</figcaption></figure>
        <figure><img class="zoom" src="media/cowcompass_e_road.jpg" alt="Urgent hazard: Daisy is 80 metres from the road the farmer marked as a hazard, call a neighbour now" loading="lazy"><figcaption>Near a hazard the farmer marked. The most urgent alert.</figcaption></figure>
        <figure><img class="zoom" src="media/cowcompass_e_night.jpg" alt="Night saving: updates every 30 minutes until 05:00, escape alerts still instant" loading="lazy"><figcaption>Night saving, and alerts that still come straight away.</figcaption></figure>
        <figure><img class="zoom" src="media/cowcompass_e_battery.jpg" alt="Bella’s collar needs charging, 2 days left, remind me tonight" loading="lazy"><figcaption>A low battery waits for the evening feed.</figcaption></figure>
        <figure><img class="zoom" src="media/cowcompass_e_still.jpg" alt="Zlatka has been on her own, away from the herd, since 03:50, could be calving or hurt" loading="lazy"><figcaption>A cow on her own, away from the herd, gets a calm nudge.</figcaption></figure>
      </div>
      <h3>What I'd design next</h3>
      <p>The biggest gap is the alert itself. If the farmer's phone has no signal, the escape alert can't reach it. The prototype shows what was missed once the signal is back, but that can be too late. So I'd let the farmer choose people who also get escape alerts, like a family member or a neighbouring farmer. They get escapes only, they see only the animal that is out, and they can do one thing: flag that they've seen her. To plan the search they call each other. This builds on the shared search from my second phase. It is a concept and isn't in the prototype.</p>
    </section>

    <section class="stack">
      <span class="k">08 · Outcome</span>
      <h2>A concept, not tested with farmers yet</h2>
      <p>The research is real: four interviews, a persona, a journey map and a user flow. I built the prototype in 2026 from that research, and no farmer has used it yet. It shows how I design for people who work outside with patchy signal, rather than proving that the product works.</p>
    </section>

    <section class="stack">
      <span class="k">09 · Next steps</span>
      <h2>What I'd test first</h2>
      <ul class="ticks" style="--accent:var(--gold)">
        <li>Show the prototype to the four households, starting with the alert. Two minutes on the fence line might be too long when a cow is heading for the road.</li>
        <li>Ask what they would pay. Price stops smallholders before any screen does, and a design can't fix that alone.</li>
        <li>Find out who should get the alert. On some farms it might be a son or a daughter rather than the person who owns the cows.</li>
      </ul>
    </section>

figcaption>From my FigJam research board. The checklist kept this structure, so checks like Point Cloud Data sit in their own section under each review type.</figcaption></figure>

    <section class="stack">
      <span class="k">04 · The prototype</span>
      <h2>One review, start to finish</h2>
      <figure class="uifig"><div class="diagram-wrap"><svg class="diagram" viewBox="0 0 760 270" role="img" aria-label="QA flow: project review, QA checklist for internal or external work, review summary, then a decision that either exports the report or sends the work back to the checklist." font-family="DM Sans, sans-serif" font-size="12.5"><defs><marker id="flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#16181F"/></marker></defs><text x="24" y="34" font-size="16" font-weight="700" font-family="Space Grotesk, sans-serif" fill="#16181F">A review ends in a report or goes back for another round</text><rect x="16" y="118" width="104" height="44" rx="8" fill="#FBF9F4" stroke="#16181F" stroke-width="1.5"/><text text-anchor="middle" fill="#16181F"><tspan x="68" y="144.5">Project review</tspan></text><rect x="150" y="118" width="104" height="44" rx="8" fill="#FBF9F4" stroke="#16181F" stroke-width="1.5"/><text text-anchor="middle" fill="#16181F" font-weight="700"><tspan x="202" y="144.5">QA checklist</tspan></text><rect x="290" y="70" width="110" height="44" rx="8" fill="#FBF9F4" stroke="#16181F" stroke-width="1.5"/><text text-anchor="middle" fill="#16181F"><tspan x="345" y="88">Internal</tspan><tspan x="345" y="104" font-size="11" fill="#585D69">survey, RoL teams</tspan></text><rect x="290" y="166" width="110" height="44" rx="8" fill="#FBF9F4" stroke="#16181F" stroke-width="1.5"/><text text-anchor="middle" fill="#16181F"><tspan x="345" y="184">External</tspan><tspan x="345" y="200" font-size="11" fill="#585D69">contractors</tspan></text><rect x="434" y="118" width="110" height="44" rx="8" fill="#FBF9F4" stroke="#16181F" stroke-width="1.5"/><text text-anchor="middle" fill="#16181F"><tspan x="489" y="144.5">Review summary</tspan></text><rect x="576" y="118" width="84" height="44" rx="8" fill="rgba(63,193,176,.2)" stroke="#1F8F80" stroke-width="2"/><text text-anchor="middle" fill="#16181F" font-weight="700"><tspan x="618" y="144.5">Decision</tspan></text><rect x="684" y="118" width="70" height="44" rx="8" fill="#FBF9F4" stroke="#16181F" stroke-width="1.5"/><text text-anchor="middle" fill="#16181F"><tspan x="719" y="136.5">Export</tspan><tspan x="719" y="152.5">report</tspan></text><g fill="none" stroke="#16181F" stroke-width="1.5"><path d="M120 140H148" marker-end="url(#flow-arrow)"/><path d="M254 140H270V92H288" marker-end="url(#flow-arrow)"/><path d="M270 140V188H288" marker-end="url(#flow-arrow)"/><path d="M400 92H417V140H432" marker-end="url(#flow-arrow)"/><path d="M400 188H417V140"/><path d="M544 140H574" marker-end="url(#flow-arrow)"/><path d="M660 140H682" marker-end="url(#flow-arrow)"/><path d="M618 162V236H202V164" marker-end="url(#flow-arrow)"/></g><text x="410" y="254" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1F8F80">back to the checklist</text></svg></div><figcaption>From my research board. Internal work comes from the survey and Rights of Light teams, external work from contractors. The decision either exports the report or sends the work back to the checklist.</figcaption></figure>
      <p>The first idea had three tabs: checklist, screenshots and report. I presented it to the analysts and the senior leaders of the team and tested it with them. The tool changed after that, but the basics were already there: every check gets a pass, needs improvement or a fail, a screenshot sits on its check, and the report lists what passed and what needs work.</p>
      <div class="strip wide" tabindex="0" aria-label="First idea screens, scroll sideways"><figure><img class="zoom" src="media/qa_first_1_checklist.jpg" alt="First idea, Checklist tab: point cloud checks marked pass or needs improvement, with a note field and a screenshot added to one check" style="object-position:0 42%" loading="lazy"><figcaption><b>First idea.</b> The checklist. Each check is a pass, needs improvement or a fail, with a note and a screenshot.</figcaption></figure><figure><img class="zoom" src="media/qa_first_2_screenshots.jpg" alt="First idea, Screenshots tab: an upload box and a screenshot linked to the check it relates to" style="object-position:0 42%" loading="lazy"><figcaption><b>First idea.</b> Screenshots in one tab, each linked to its check.</figcaption></figure><figure><img class="zoom" src="media/qa_first_3_report.jpg" alt="First idea, Report tab: 17 passed, 0 issues and 4 improvements, with lists of what is good and what needs improvement" style="object-position:0 58%" loading="lazy"><figcaption><b>First idea.</b> The report lists what passed and what needs improvement.</figcaption></figure></div>
      <p class="small-note">Screens from the phase 2 concept, rebuilt in Lovable with made-up projects and people. The two report screens are from the version my team piloted. The queue, the tree, @mentions and the failed check came after the usability test. Click a screen to enlarge it.</p>
      <div class="strip wide" tabindex="0" aria-label="QA tool screens, scroll sideways"><figure><img class="zoom" src="media/qa_01_queue_filters.png" alt="The review queue with a filter open on the Team column" loading="lazy"><figcaption><b>After the test.</b> The review queue. Every column sorts and filters.</figcaption></figure><figure><img class="zoom" src="media/qa_02_review_header_tree.png" alt="A drawing review with job details, progress and the checklist as a tree" loading="lazy"><figcaption><b>After the test.</b> A review: job details, progress and the checklist as a tree.</figcaption></figure><figure><img class="zoom" src="media/qa_03_fail_check_conversation.png" alt="A failed check with the reviewer note, a screenshot slot and the conversation" loading="lazy"><figcaption><b>After the test.</b> A failed check opens in place, with a note, a screenshot slot and the conversation.</figcaption></figure><figure><img class="zoom" src="media/qa_04_mention.png" alt="Typing @ in a comment suggests a colleague with role and team" loading="lazy"><figcaption><b>After the test.</b> Typing @ suggests people with their role and team.</figcaption></figure><figure><img class="zoom" src="media/qa_05_report_summary.png" alt="Report summary counting issues, improvements and checks not done" loading="lazy"><figcaption><b>In the pilot.</b> The report counts issues, improvements and checks not done.</figcaption></figure><figure><img class="zoom" src="media/qa_06_report_issue.png" alt="An issue in the report with Approve locked" loading="lazy"><figcaption><b>In the pilot.</b> Approve stays locked until every check is done.</figcaption></figure></div>

    <section class="stack">
      <span class="k">05 · Edge cases</span>
      <h2>Work goes back for fixes, but round two isn't designed</h2>
      <h3>Handled in the prototype</h3>
      <ul class="ticks" style="--accent:var(--teal)">
        <li>A half-finished review can't be signed off. Approve stays locked until every check is done, and the report counts the checks not done.</li>
        <li>A check that doesn't apply to a job can be marked N/A rather than forced into a pass or a fail.</li>
        <li>A problem that isn't serious enough to fail goes under "needs improvement", and the report lists those separately from the fails.</li>
        <li>A review with a fail can be returned for fixes, with a note on each issue saying what the team must do.</li>
      </ul>
      <h3>What I'd design next</h3>
      <p class="small-note">Designed after the pilot. Not built or tested.</p>
      <p>The flow has a loop back to the checklist, and the report has a Return for fixes button. I never designed what the reviewer sees when the fixed drawing comes back. The tool was meant to keep a record of who checked what, so a check that failed and then passed has to show both results.</p>
      <figure class="uifig"><img class="ui zoom" src="media/qa_07_round_two.png" alt="Concept screen: round 2 of a review. The failed check shows the round 1 note as read only next to the author's reply, and the checks that passed in round 1 are collapsed with a Reopen link." loading="lazy"><figcaption><b>Concept, not built.</b> Round 2 of the same review. Only the checks that failed or needed improvement are open.</figcaption></figure>
      <ul class="ticks" style="--accent:var(--teal)">
        <li>Round 2 opens in the same review rather than a new one, so the first round's notes and screenshots stay on their checks.</li>
        <li>Only the checks that failed or needed improvement are open. The ones that passed carry over, and the reviewer can reopen any of them, because a fix can break something else.</li>
        <li>The round 1 note is read only and the author's reply sits next to it, so the reviewer compares the fix with the original comment.</li>
        <li>The report would show both rounds for each check, with who checked it each time.</li>
      </ul>
      <p>Two more cases I'd look at after that. An author might disagree with a fail. The conversation is there for that, but there is no disputed state and nobody is named to decide. In a small team a reviewer will sometimes be asked to check their own drawing, and the report should at least show that.</p>
    </section>

    <section class="stack">
      <span class="k">06 · Outcome</span>
      <h2>Piloted on about 10 projects</h2>
      <p>My team, the measured survey team, used it on about 10 projects. Each piece of feedback was written once, next to its check, so nobody had to rewrite it. Before the tool, that rewriting took 2 to 3 hours per project. I didn't time it again during the pilot, so the saving is an estimate.</p>
      <p>Senior stakeholders wanted to know what I was proposing. In the end the tool wasn't a priority for DPR, and the one engineer who would have maintained it already covered everything else. I think it wasn't worth the cost for a tool that two or three teams would use. Phase 2, with the second QA team and the contractors, didn't go ahead.</p>
      <div class="reflect">From a demo: the head of the analyst team saw that the export could produce the reports they send to surveyors, so I kept the export flexible.</div>
    </section>

    <section class="stack">
      <span class="k">07 · Testing the phase 2 concept</span>
      <h2>Six changes from a usability test</h2>
      <p>I tested the phase 2 concept with one person from outside the industry. They had never done drawing QA, so they got stuck on things my team had stopped noticing.</p>
      <div class="changes"><div class="chg"><span class="k">Feedback</span><p>The To review and In progress tabs didn't look clickable</p><span class="k to">Change</span><p>Pointer and hover on everything you can click, and a whole row opens its review</p></div><div class="chg"><span class="k">Feedback</span><p>They wanted to sort and filter by clicking a column</p><span class="k to">Change</span><p>Every column header sorts and filters, and active filters show as chips</p></div><div class="chg"><span class="k">Feedback</span><p>Back didn't return them to where they had been</p><span class="k to">Change</span><p>Back keeps the tab, filters and sort, and so does the browser button</p></div><div class="chg"><span class="k">Feedback</span><p>They wanted to tag people and ask someone else to review</p><span class="k to">Change</span><p>Reviewers, assignee and contributors, Request review, and @mentions</p></div><div class="chg"><span class="k">Feedback</span><p>The checklist should branch like a tree</p><span class="k to">Change</span><p>Sections nest under the review type, with progress for each section</p></div><div class="chg"><span class="k">Feedback</span><p>It felt like a dull tool</p><span class="k to">Change</span><p>Loading states, a progress bar and short transitions between pages</p></div></div>
    </section>

    <section class="stack">
      <span class="k">08 · Reflections</span>
      <h2>What I'd do differently</h2>
      <ul class="ticks" style="--accent:var(--gold)">
        <li>Narrow earlier. I designed for six problems before asking which one mattered most.</li>
        <li>Share rough work sooner. I thought my mind map wasn't good enough to show, and it was the most useful thing I shared.</li>
        <li>Measure during the pilot, not only before. I timed the admin before the tool but not after, so the saving is still an estimate. I'd also track the time from feedback to fix.</li>
      </ul>

/* Cow Compass hero: the farm from the prototype. The herd grazes, Daisy gets out through the north gate and comes back. */
function ccAnim(root){const box=root.querySelector('.cc-anim');if(!box)return;
  const g=box.querySelector('.cc-cows'),trail=box.querySelector('.cc-trail'),card=box.querySelector('.cc-card');
  const F=[[70,175],[180,150],[300,150],[338,250],[322,385],[205,440],[112,425],[56,320]];
  const inside=(x,y)=>{let c=false;for(let i=0,j=F.length-1;i<F.length;j=i++){const[a,b]=F[i],[p,q]=F[j];if((b>y)!==(q>y)&&x<(p-a)*(y-b)/(q-b)+a)c=!c}return c};
  let seed=11;const rnd=()=>(seed=seed*16807%2147483647)/2147483647;
  const herd=[];
  const spot=(cx,cy,r,self,gap)=>{for(let k=0;k<80;k++){const x=cx+(rnd()*2-1)*r,y=cy+(rnd()*2-1)*r;
    if([[0,0],[12,0],[-12,0],[0,12],[0,-12]].every(([a,b])=>inside(x+a,y+b))&&herd.every(c=>c===self||Math.hypot(c.tx-x,c.ty-y)>=gap))return[x,y]}return[cx,cy]};
  for(let i=0;i<16;i++){const[x,y]=i===0?[196,228]:spot(200,300,140,null,34);herd.push({x,y,tx:x,ty:y,h:rnd()*360,sp:9+rnd()*7,wait:rnd()*3})}
  const COW='<ellipse cx="0" cy="4" rx="9" ry="12" fill="#FFFBEF" stroke="#17200F" stroke-width="1.8"/><path d="M-6 0c2-3 6-2 6 1s-4 4-6 2z" fill="#17200F"/><circle cx="4.5" cy="9" r="3" fill="#17200F"/><path d="M2 -3c2 0 3 1 3 2s-2 1-3 0z" fill="#17200F"/><ellipse cx="-6.5" cy="-11.5" rx="3" ry="1.6" fill="#FFFBEF" stroke="#17200F" stroke-width="1.4" transform="rotate(-20 -6.5 -11.5)"/><ellipse cx="6.5" cy="-11.5" rx="3" ry="1.6" fill="#FFFBEF" stroke="#17200F" stroke-width="1.4" transform="rotate(20 6.5 -11.5)"/><ellipse cx="0" cy="-11" rx="5.2" ry="6" fill="#F6C6B4" stroke="#17200F" stroke-width="1.8"/><circle cx="-1.8" cy="-14" r=".9" fill="#17200F"/><circle cx="1.8" cy="-14" r=".9" fill="#17200F"/>';
  const RING='<g class="cc-ring" visibility="hidden"><circle r="12" fill="#FF5A36" opacity=".5"><animate attributeName="r" values="10;26" dur="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values=".6;0" dur="1.6s" repeatCount="indefinite"/></circle><circle r="15" fill="none" stroke="#FF5A36" stroke-width="3"/></g>';
  const NAME='<text class="cc-name" visibility="hidden" y="-21" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="12" font-weight="700" paint-order="stroke" stroke="#FFFBEF" stroke-width="3.5" fill="#17200F">Daisy</text>';
  g.innerHTML=herd.map((c,i)=>`<g>${i===0?RING:''}<g class="b">${COW}</g>${i===0?NAME:''}</g>`).join('');
  const els=[...g.children],bodies=els.map(e=>e.querySelector('.b')),D=herd[0],ring=g.querySelector('.cc-ring'),name=g.querySelector('.cc-name');
  const paint=()=>herd.forEach((c,i)=>{els[i].setAttribute('transform',`translate(${c.x.toFixed(1)} ${c.y.toFixed(1)})`);bodies[i].setAttribute('transform',`rotate(${c.h.toFixed(0)})`)});
  const say=(kind,b,s)=>{card.className='cc-card '+kind;card.innerHTML=`<span class="dot"></span><span><b>${b}</b><small>${s}</small></span>`;void card.offsetWidth;card.classList.add('pop')};
  const steer=(c,dt,speed)=>{const dx=c.tx-c.x,dy=c.ty-c.y,d=Math.hypot(dx,dy);if(d<1.2)return true;
    const want=Math.atan2(dy,dx)*180/Math.PI+90;const diff=((want-c.h+540)%360)-180;c.h+=Math.max(-200*dt,Math.min(200*dt,diff));
    const step=Math.min(d,speed*dt);c.x+=dx/d*step;c.y+=dy/d*step;return false};
  const OUT=[[184,186],[180,150],[188,130],[202,114],[222,104],[244,100]];
  let phase='graze',pt=0,path=null,pi=0,trailPts=[],alerted=false,back=false;
  const follow=(dt,speed)=>{D.tx=path[pi][0];D.ty=path[pi][1];if(steer(D,dt,speed)){pi++;return pi>=path.length}return false};
  function tick(dt){pt+=dt;
    herd.forEach((c,i)=>{if(i===0&&phase!=='graze'&&phase!=='home')return;
      if(c.wait>0){c.wait-=dt;return}
      if(steer(c,dt,c.sp)){const[x,y]=spot(c.x,c.y,50,c,26);c.tx=x;c.ty=y;c.wait=1+rnd()*3.5}});
    if(phase==='graze'&&pt>3){phase='out';pt=0;path=OUT;pi=0;alerted=false;trailPts=[];trail.style.opacity=1}
    else if(phase==='out'){if(D.y<150){trailPts.push([D.x,D.y]);if(!alerted){alerted=true;ring.setAttribute('visibility','visible');name.setAttribute('visibility','visible');say('alert','Daisy left the North field','Near the north gate · just now')}}
      if(follow(dt,28)){phase='lost';pt=0;say('alert','Daisy is 420 m from you','At the forest edge · updated 20 s ago')}}
    else if(phase==='lost'&&pt>2.8){phase='back';pt=0;path=[...OUT].reverse().concat([[194,214]]);pi=0;back=false}
    else if(phase==='back'){if(!back&&D.y>162){back=true;ring.setAttribute('visibility','hidden');name.setAttribute('visibility','hidden');trail.style.transition='opacity 1.2s';trail.style.opacity=0;say('safe','Daisy is back inside','All 16 safe · logged in 10 seconds')}
      if(follow(dt,32)){phase='home';pt=0;D.tx=D.x;D.ty=D.y;D.wait=2}}
    else if(phase==='home'&&pt>4){phase='graze';pt=0;trail.style.transition='';trail.setAttribute('d','');say('safe','All 16 cows are safe','North field · updated just now')}
    if(trailPts.length>1&&phase!=='home'&&phase!=='graze')trail.setAttribute('d','M'+trailPts.filter((p,i)=>i%3===0||i===trailPts.length-1).map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join('L'))}
  paint();
  if(reduce||!('IntersectionObserver' in window))return;
  let last=0,raf=0,vis=false;
  const frame=t=>{raf=0;if(!vis)return;const dt=last?Math.min(.05,(t-last)/1000):0;last=t;tick(dt);paint();raf=requestAnimationFrame(frame)};
  new IntersectionObserver(es=>{vis=es[0].isIntersecting;if(vis&&!raf){last=0;raf=requestAnimationFrame(frame)}}).observe(box);
}

const desk=$('#desk'),tabs=$('#tabs');const open={};let z=10,cascade=0;
function deskSize(){return{W:desk.clientWidth,H:desk.clientHeight}}
/* windows open to the right of the icons: the right edge of any icon in the left half of the desk, plus a gap */
function iconEdge(){const box=$('#icons');const{W}=deskSize();let r=0;[...box.children].forEach(b=>{const x=box.offsetLeft+b.offsetLeft;if(x<W/2)r=Math.max(r,x+b.offsetWidth)});return r||box.offsetLeft+(box.offsetWidth||96)}
function leftEdge(){const{W}=deskSize();const L=Math.min(iconEdge()+44,Math.max(14,W-404));desk.style.setProperty('--maxL',L+'px');return L}
function placeSticky(){const s=$('.desk-sticky');if(!s)return;const{W}=deskSize();const h=open.hello&&!open.hello.el.hidden?open.hello.el:null;
  const x=(h?h.offsetLeft+h.offsetWidth:leftEdge()+470)+48;s.hidden=x+250>W;if(!s.hidden)s.style.left=x+'px'}
function place(id,w){
  const{W,H}=deskSize();const d=WINS[id];const L=leftEdge();let width=Math.min(d.w,W-L-24);w.style.width=width+'px';
  let x,y,h;
  if(id==='hello'){x=L;y=24}
  else if(d.tall){const o=id==='moonmates'?0:(open.moonmates?30:0);x=Math.max(L,Math.min(W-width-8,Math.min(W-width-24,L+470+40)+o));y=14+o}
  else{x=Math.max(L,Math.min(W-width-20,L+40+cascade*34));y=Math.min(H-200,40+cascade*30);cascade=(cascade+1)%6}
  h=d.tall?H-34:Math.min(H-y-20,680);

function focusWin(id){Object.values(open).forEach(o=>o.el.classList.remove('focus'));const o=open[id];if(!o)return;o.el.style.zIndex=++z;o.el.classList.add('focus');renderTabs(id)}
function openWin(id){
  if(!WINS[id])return;
  if(document.body.classList.contains('docmode')){if(id==='contact'){goTo(document.querySelector('#doc .about-contact')||'about');return}goTo(document.getElementById(id)?id:'work');return}
  if(!open[id]){const el=makeWin(id,false);place(id,el);desk.appendChild(el);open[id]={el,min:false};wire(el,id);pushWin(id)}
  const o=open[id];o.el.hidden=false;o.min=false;focusWin(id);

/* in document mode, jump straight to a window and correct the position while lazy images above it load */
function goTo(id){const t=typeof id==='string'?document.getElementById(id):id;if(!t)return;t.scrollIntoView({block:'start'});
  let n=0,stop=false;const quit=()=>{stop=true};addEventListener('touchstart',quit,{once:true,passive:true});addEventListener('wheel',quit,{once:true,passive:true});
  const fix=()=>{if(stop)return;const off=t.getBoundingClientRect().top-(parseFloat(getComputedStyle(t).scrollMarginTop)||0);if(Math.abs(off)>4)t.scrollIntoView({block:'start'});if(++n<8)setTimeout(fix,250)};setTimeout(fix,250)}
